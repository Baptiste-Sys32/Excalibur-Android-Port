name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync Excalidraw assets
        run: npm run sync:excalidraw-assets
      - name: Verify synced assets are clean
        run: git diff --exit-code -- public/excalidraw-assets
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npm run lint
